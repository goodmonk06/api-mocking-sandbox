version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: api-mocking-db
    environment:
      POSTGRES_USER: mockuser
      POSTGRES_PASSWORD: mockpass
      POSTGRES_DB: apimocking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockuser"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
